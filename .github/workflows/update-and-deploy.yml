name: Update data & deploy

on:
  schedule:
    # mỗi giờ, phút :23
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect data & run analysis
        run: npm run collect

      - name: Monitor preset health
        run: npx tsx scripts/monitor-presets.ts

      - name: Monitor fusion health
        run: npx tsx scripts/monitor-fusion.ts

      - name: Send notifications (optional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/notify.ts

      - name: Commit updated data
        # Chạy cả khi trigger là push: commit bằng GITHUB_TOKEN không trigger lại
        # workflow (GitHub chặn đệ quy sẵn), và giúp public/data trong repo luôn
        # khớp với site vừa deploy — tránh local checkout đọc data cũ sau merge.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: cập nhật $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -X theirs origin main
          git push

      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
